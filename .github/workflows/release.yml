name: Release on version change

# Tags and publishes a release whenever AGMAN_VERSION in bin/agman lands on main
# at a version that has no tag yet, then asks the tap workflow to bump the
# formula. Keeps the three things CLAUDE.md requires to agree — the git tag,
# AGMAN_VERSION, and the GitHub Release — in agreement automatically.
#
# Triggered by CI completing rather than by the push itself, so a commit whose
# tests failed is never released. Also runnable by hand, which is how a version
# that landed before this workflow existed gets its release.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag and release
    # Only a green CI run on a push to main. workflow_dispatch has no
    # workflow_run payload, so it passes this guard on the first clause.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v5
        with:
          # Release exactly what CI validated, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Read the version and decide whether to release
        id: v
        run: |
          set -euo pipefail
          version="$(grep -m1 '^AGMAN_VERSION=' bin/agman | cut -d'"' -f2)"
          if [ -z "$version" ]; then
            echo "::error::could not read AGMAN_VERSION from bin/agman"
            exit 1
          fi
          # semver.org: MAJOR.MINOR.PATCH with an optional pre-release suffix.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::AGMAN_VERSION '$version' is not a semver version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

          case "$version" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::notice::v$version is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AGMAN_VERSION is $version and v$version has no tag; releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and publish the release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" "$SHA" -m "agman $TAG"
          git push origin "$TAG"

          # GitHub's generated notes summarise the merged pull requests since the
          # previous tag; the install block is appended so the release page is
          # useful on its own.
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$SHA" --jq '.body' > notes.md
          {
            printf '\n## Install\n\n```bash\nbrew install memandip/agman/agman\n```\n\n'
            printf 'Already installed: `brew upgrade agman`, or `agman update`.\n'
          } >> notes.md

          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --title "agman $TAG" --notes-file notes.md \
              --target "$SHA" --prerelease
          else
            gh release create "$TAG" --title "agman $TAG" --notes-file notes.md \
              --target "$SHA"
          fi
          echo "::notice::published $TAG"

      - name: Ask the tap workflow to bump the formula
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A release created with GITHUB_TOKEN does not start workflows, so
          # homebrew.yml's `on: release` will not fire here. workflow_dispatch is
          # one of the two documented exceptions to that rule, so dispatch it.
          gh workflow run homebrew.yml --ref main -f tag="${{ steps.v.outputs.tag }}"
          echo "::notice::dispatched homebrew.yml for ${{ steps.v.outputs.tag }}"
