name: Bump Homebrew formula

# Asks memandip/homebrew-agman to bump its formula to a release. The bump
# itself — download, sha256, formula rewrite, `brew install` + `brew test`,
# push to the tap's main — is the tap's own bump.yml, running under the tap's
# GITHUB_TOKEN. Only the cross-repository trigger needs a secret here:
# HOMEBREW_TAP_TOKEN, a personal access token allowed to dispatch workflows on
# memandip/homebrew-agman (fine-grained: repository access to homebrew-agman
# with Actions "read and write"; classic: the `repo` scope). Without the secret
# this reports a notice and exits cleanly. The tap also polls for new releases
# hourly, so a missing or under-scoped token delays a bump rather than losing it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to bump the formula to (e.g. v0.16.0)"
        required: true

permissions:
  contents: read

jobs:
  bump:
    name: Dispatch the tap bump
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            echo "::error::could not determine a tag to bump to"
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Check tap token
        id: guard
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the dispatch. The tap's hourly poll will pick the release up."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch bump.yml in memandip/homebrew-agman
        if: steps.guard.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -uo pipefail
          if out="$(gh workflow run bump.yml -R memandip/homebrew-agman --ref main -f tag="$TAG" 2>&1)"; then
            echo "::notice::dispatched homebrew-agman's bump.yml for $TAG"
          else
            printf '%s\n' "$out"
            case "$out" in
              *"not found on the default branch"*)
                echo "::error::bump.yml is not on memandip/homebrew-agman's main yet; the tap's hourly poll will pick up $TAG once it is." ;;
              *)
                echo "::error::HOMEBREW_TAP_TOKEN cannot dispatch workflows on memandip/homebrew-agman. Regenerate it with Actions read/write on that repository (or the classic 'repo' scope). The tap's hourly poll will still pick up $TAG." ;;
            esac
            exit 1
          fi
