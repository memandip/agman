name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: bash tests/run.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        # SC2088 excluded: '~/.claude' appears in user-facing message strings
        # and test descriptions, never as a path the shell must expand.
        run: shellcheck -S warning -e SC2088 bin/agman install.sh tests/run.sh
